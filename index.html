<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Kelas 11 | SMA Santa Laurensia</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="adel-sarah-halaman-masuk">

    <section class="adel-sarah-masuk">
        <div class="adel-sarah-portal">
            <img src="logo.png" alt="Logo SMA Santa Laurensia" class="adel-sarah-portal-logo">
            <h2>Masuk ke akun Anda</h2>
            <p class="adel-sarah-portal-sub">Gunakan username dan password sekolah.</p>
            <div class="adel-sarah-isian">
                <p class="adel-sarah-isian-judul">Username</p>
                <input type="text" class="adel-sarah-kotak-isi" id="adel-sarah-username" name="username" placeholder="Masukkan username">
            </div>
            <div class="adel-sarah-isian">
                <p class="adel-sarah-isian-judul">Password</p>
                <input type="password" class="adel-sarah-kotak-isi" id="adel-sarah-password" name="password" placeholder="Masukkan password">
            </div>
            <div class="adel-sarah-portal-baris">
                <div class="adel-sarah-ingat">
                    <input type="checkbox" class="adel-sarah-centang" id="adel-sarah-ingat" name="ingat">
                    <p>Ingat saya</p>
                </div>
                <a href="#">Lupa password?</a>
            </div>
            <a class="adel-sarah-tombol-masuk" href="beranda.html">Masuk</a>
        </div>
    </section>

</body>
</html>
