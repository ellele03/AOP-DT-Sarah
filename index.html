<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Kelas 11 | SMA Santa Laurensia</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="as-halaman-masuk">

    <section class="as-masuk">
        <div class="as-portal">
            <img src="images/logo.png" alt="Logo SMA Santa Laurensia" class="as-portal-logo">
            <h2>Masuk ke akun Anda</h2>
            <p class="as-portal-sub">Gunakan username dan password sekolah.</p>
            <div class="as-isian">
                <p class="as-isian-judul">Username</p>
                <input type="text" class="as-kotak-isi" id="username" name="username" placeholder="Masukkan username">
            </div>
            <div class="as-isian">
                <p class="as-isian-judul">Password</p>
                <input type="password" class="as-kotak-isi" id="password" name="password" placeholder="Masukkan password">
            </div>
            <div class="as-portal-baris">
                <div class="as-ingat">
                    <input type="checkbox" class="as-centang" id="ingat" name="ingat">
                    <p>Ingat saya</p>
                </div>
                <a href="#">Lupa password?</a>
            </div>
            <a class="as-tombol-masuk" href="beranda.html">Masuk</a>
        </div>
    </section>

</body>
</html>
